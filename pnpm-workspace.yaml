packages:
  - "apps/*"
  - "packages/*"

# unrs-resolver ships a postinstall build script (used by some eslint resolvers).
# We don't need it built; explicitly disallow so `pnpm install` doesn't warn/fail.
allowBuilds:
  # These postinstall scripts are just funding/telemetry messages — not needed.
  '@nestjs/core': false
  '@scarf/scarf': false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - expo-updates@57.0.9
  - expo-image-picker@57.0.6
  - '@expo/cli@57.0.10'
  - '@expo/config-plugins@57.0.6'
  - '@expo/config@57.0.6'
  - '@expo/fingerprint@0.20.6'
  - '@expo/image-utils@0.11.4'
  - '@expo/metro-config@57.0.7'
  - '@expo/prebuild-config@57.0.9'
  - '@expo/require-utils@57.0.4'
  - '@expo/router-server@57.0.4'
  - babel-preset-expo@57.0.4
  - expo-asset@57.0.7
  - expo-constants@57.0.7
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7
  - expo-modules-jsi@57.0.4
  - expo@57.0.8
  - '@expo/metro-runtime@57.0.7'
  - expo-dev-client@57.0.9
  - expo-dev-launcher@57.0.9
  - expo-dev-menu@57.0.9
  - expo-linking@57.0.4
  - expo-router@57.0.8
  - expo-splash-screen@57.0.5
  - expo-updates@57.0.10
